services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    hostname: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - ./mongodb-init.js:/docker-entrypoint-initdb.d/mongodb-init.js:ro
      - mongodb-log:/var/log/mongodb/
    env_file:
      - .env
    environment:
      MONGO_INITDB_DATABASE: todosdb
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

    networks:
      - todo-api
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')",
      "--authenticationDatabase", "admin", "-u", "admin", "-p", "password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  #Optional: MongoDB GUI (Mongo Express - web-based admin interface)
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - "8083:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_AUTH_DATABASE: admin
      # Optional: enable HTTP basic auth for Mongo Express UI
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}

    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - todo-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  #========================#
  #Todo service#
  #=======================#
  checkingoutresttestclient:
    build: .
    container_name: checkingoutresttestclient
    ports:
      - "2000:2000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - SPRING_APPLICATION_NAME=CheckingOutRestTestClient
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_DATA_MONGODB_URI=mongodb://tjtechy:apppass@mongodb:27017/todosdb?authSource=todosdb
      - SPRING_APPLICATION_JSON={"api":{"endpoint":{"baseurl":"/api/v1/todo"}}}

    networks:
      - todo-api


networks:
  todo-api:
    driver: bridge
    name: todo-api
volumes:
  mongodb-data:
    driver: local
    name: mongodb-data
  mongodb-log:
    driver: local
    name: mongodb-log



